            --surface-elevated: #1a1a1a;
            --hairline: #cccccc;
            --hairline-strong: #5e5e5e;
            --body: #1a1a1a;
            --mute: #757575;
            --on-dark: #ffffff;
            --on-dark-mute: rgba(255,255,255,0.85);
        }

        /* Dark theme class */
        body.dark-mode {
            --primary: #4d8aff;
            --primary-dark: #3a6fd6;
            --secondary: #e53e4e;
            --secondary-dark: #b52a38;
            --accent-gold: #f7c948;
            --accent-cyan: #4dd0e1;
            --ink: #ffffff;
            --canvas: #0a0b0d;
            --surface-soft: #1a1c22;
            --surface-elevated: #2a2e36;
            --hairline: #3a3f48;
            --hairline-strong: #5a606c;
            --body: #d0d4dc;
            --mute: #9aa0aa;
            --on-dark: #ffffff;
            --on-dark-mute: rgba(255,255,255,0.85);
        }

        /* Auto: uses prefers-color-scheme — only applies when NO class is set */
        @media (prefers-color-scheme: dark) {
            body:not(.light-mode):not(.dark-mode) {
                --primary: #4d8aff;
                --primary-dark: #3a6fd6;
                --secondary: #e53e4e;
                --secondary-dark: #b52a38;
                --accent-gold: #f7c948;
                --accent-cyan: #4dd0e1;
                --ink: #ffffff;
                --canvas: #0a0b0d;
                --surface-soft: #1a1c22;
                --surface-elevated: #2a2e36;
                --hairline: #3a3f48;
                --hairline-strong: #5a606c;
                --body: #d0d4dc;
                --mute: #9aa0aa;
                --on-dark: #ffffff;
                --on-dark-mute: rgba(255,255,255,0.85);
            }
        }

        /* ================================================================
               RESET & BASE
               ================================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', 'Arial', sans-serif;
            background: var(--canvas);
            color: var(--ink);
            line-height: 1.5;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }
        img {
            max-width: 100%;
            display: block;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ================================================================
               TYPOGRAPHY
               ================================================================ */
        .display-xl {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.25;
        }
        .display-lg {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.25;
        }
        .heading-xl {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.25;
        }
        .heading-lg {
            font-size: 22px;
            font-weight: 400;
            line-height: 1.75;
        }
        .heading-md {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.25;
        }
        .heading-sm {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
        }
        .card-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.47;
        }
        .body-md {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
        }
        .body-sm {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.67;
        }
        .utility-xs {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.5;
            text-transform: uppercase;
        }

        /* ================================================================
               COMPONENTS (using theme variables)
               ================================================================ */

        /* Buttons */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 11px 24px;
            height: 44px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            min-width: 100px;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline-dark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 11px 13px;
            height: 44px;
            border: 1px solid #ffffff;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            min-width: 100px;
        }
        .btn-outline-dark:hover {
            background: rgba(255,255,255,0.08);
        }

        .btn-ghost-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.2s;
        }
        .btn-ghost-link:hover {
            color: var(--primary-dark);
        }
        .btn-ghost-link i {
            font-size: 14px;
        }

        /* Corner square (NVIDIA) */
        .corner-top-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 0;
            z-index: 1;
        }
        .corner-red::before {
            background: var(--secondary);
        }
        .corner-gold::before {
            background: var(--accent-gold);
        }
        .corner-cyan::before {
            background: var(--accent-cyan);
        }
        .corner-bottom-right::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 0;
            z-index: 1;
        }

        /* Cards */
        .product-card,
        .feature-card {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: 2px;
            padding: 24px;
            transition: border-color 0.2s, background 0.3s;
            position: relative;
            overflow: hidden;
        }
        .product-card:hover,
        .feature-card:hover {
            border-color: var(--primary);
        }
        .product-card .card-img {
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 2px;
            background: var(--surface-soft);
            margin-bottom: 12px;
        }
        .product-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card .card-title {
            margin-bottom: 4px;
        }
        .product-card .body-sm {
            color: var(--body);
            margin-bottom: 12px;
        }
        .feature-card .feature-icon {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }
        .feature-card .heading-md {
            margin-bottom: 4px;
        }
        .feature-card .body-md {
            color: var(--body);
        }

        /* Hero dark */
        .hero-dark {
            background: #000000;
            color: #ffffff;
            padding: 80px 48px;
            position: relative;
            overflow: hidden;
        }
        .hero-dark .hero-bg {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%),
                url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1600&q=80') center center / cover no-repeat;
            z-index: 0;
        }
        .hero-dark .hero-content {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .hero-dark .hero-text {
            flex: 1;
            max-width: 560px;
        }
        .hero-dark .hero-text .display-xl {
            margin-bottom: 16px;
        }
        .hero-dark .hero-text .heading-lg {
            color: rgba(255,255,255,0.7);
            margin-bottom: 24px;
            font-weight: 400;
        }
        .hero-dark .hero-text .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .hero-dark .hero-media {
            flex: 1;
            border-radius: 2px;
            overflow: hidden;
            aspect-ratio: 16/10;
            background: #1a1a1a;
        }
        .hero-dark .hero-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CTA dark */
        .cta-dark {
            background: #000000;
            color: #ffffff;
            padding: 64px 48px;
            text-align: center;
        }
        .cta-dark .heading-xl {
            margin-bottom: 16px;
        }
        .cta-dark .body-md {
            color: rgba(255,255,255,0.7);
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Utility bar */
        .utility-bar {
            background: #000000;
            color: #ffffff;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 24px;
            font-size: 12px;
            font-weight: 400;
            border-bottom: 1px solid #5e5e5e;
        }
        .utility-bar .util-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .utility-bar .util-links a {
            color: rgba(255,255,255,0.7);
            transition: color 0.2s;
        }
        .utility-bar .util-links a:hover {
            color: #ffffff;
        }
        .utility-bar .util-links .divider {
            color: #5e5e5e;
        }

        /* Header */
        .header {
            background: var(--canvas);
            border-bottom: 1px solid var(--hairline);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: var(--ink);
        }
        .header .brand i {
            font-size: 28px;
            color: var(--primary);
        }
        .header .brand .highlight {
            color: var(--primary);
        }
        .header .brand .highlight-red {
            color: var(--secondary);
        }
        .header .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .controls .theme-toggle {
            background: transparent;
            border: none;
            color: var(--ink);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border-radius: 2px;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header .controls .theme-toggle:hover {
            background: var(--surface-soft);
        }
        .header .controls .hamburger {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .header .controls .hamburger:hover {
            background: var(--surface-soft);
        }
        .header .controls .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--ink);
            border-radius: 2px;
            transition: 0.2s;
        }

        /* Navigation overlay */
        .nav-overlay {
            position: fixed;
            inset: 0;
            background: var(--canvas);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.95);
        }
        body.dark-mode .nav-overlay,
        body:not(.light-mode):not(.dark-mode) .nav-overlay {
            background: rgba(10,11,13,0.95);
        }
        .nav-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .nav-overlay .nav-links {
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
        }
        .nav-overlay .nav-links a {
            transition: color 0.2s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
        }
        .nav-overlay .nav-links a:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .nav-overlay .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 32px;
            background: transparent;
            border: none;
            color: var(--ink);
            cursor: pointer;
            padding: 8px;
        }

        /* Sub-nav */
        .sub-nav {
            background: var(--surface-soft);
            color: var(--ink);
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--hairline);
            overflow-x: auto;
            transition: background 0.3s, border-color 0.3s;
        }
        .sub-nav .sub-inner {
            display: flex;
            align-items: center;
            gap: 24px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sub-nav .sub-inner a {
            color: var(--mute);
            white-space: nowrap;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }
        .sub-nav .sub-inner a:hover {
            border-bottom-color: var(--primary);
            color: var(--ink);
        }
        .sub-nav .sub-inner a.active {
            border-bottom-color: var(--primary);
            color: var(--ink);
        }
        .sub-nav::-webkit-scrollbar {
            height: 0;
        }

        /* --- FOOTER — ALWAYS VISIBLE with solid colors, independent of theme --- */
        .footer-dark {
            background: #0a0b0d;   /* very dark but not pure black for depth */
            color: #ffffff;
            padding: 64px 48px;
            border-top: 2px solid var(--primary);
            margin-top: auto;
            display: block;
            width: 100%;

        .footer-dark .footer-inner {

            margin: 0 auto;

            grid-template-columns: repeat(4, 1fr);
            gap: 32px;

               LAYOUT HELPERS
               ================================================================ */

            grid-template-columns: repeat(3, 1fr);

        }
        @media (max-width: 480px) {
            .display-xl {
                font-size: 28px;
            }

        /* ================================================================
               SECTION REVEAL
               ================================================================ */
        .section-reveal {
            opacity: 0;

               THEME TOGGLE ICON STATES

        }

    <script>
        (function() {
            'use strict';

            // --- Theme toggle (light / dark / auto) ---
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            // Default to 'auto' if not set
            let currentTheme = localStorage.getItem('theme') || 'auto';
            applyTheme(currentTheme);

            function applyTheme(theme) {
                body.classList.remove('light-mode', 'dark-mode');
                if (theme === 'light') {
                    body.classList.add('light-mode');
                } else if (theme === 'dark') {
                    body.classList.add('dark-mode');
                }
                // 'auto' means no class — uses media query
                localStorage.setItem('theme', theme);
                currentTheme = theme;
            }

            themeToggle.addEventListener('click', function() {
                let nextTheme;
                if (currentTheme === 'light') nextTheme = 'dark';
                else if (currentTheme === 'dark') nextTheme = 'auto';
                else nextTheme = 'light';
                applyTheme(nextTheme);
            });

            // --- Navigation overlay ---
            const hamburger = document.getElementById('hamburgerBtn');
            const navOverlay = document.getElementById('navOverlay');
            const closeNavBtn = document.getElementById('closeNavBtn');

            function openNav() {
                navOverlay.classList.add('open');
            }
            function closeNav() {
                navOverlay.classList.remove('open');
            }

            hamburger.addEventListener('click', openNav);
            closeNavBtn.addEventListener('click', closeNav);
            navOverlay.addEventListener('click', function(e) {
                if (e.target === navOverlay) closeNav();
            });
            navOverlay.querySelectorAll('.nav-links a').forEach(function(link) {
                link.addEventListener('click', closeNav);
            });

            // --- Section reveal ---
            const revealEls = document.querySelectorAll('.section-reveal');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.10, rootMargin: '0px 0px -30px 0px' });
                revealEls.forEach(function(el) {
                    observer.observe(el);
                });
                // Initial check
                setTimeout(function() {
                    revealEls.forEach(function(el) {
                        if (el.getBoundingClientRect().top < window.innerHeight * 0.85) {
                            el.classList.add('visible');
                        }
                    });
                }, 300);
            } else {
                revealEls.forEach(function(el) { el.classList.add('visible'); });
            }

            // --- Sub-nav active link ---
            const subLinks = document.querySelectorAll('.sub-nav .sub-inner a');
            subLinks.forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    subLinks.forEach(function(l) { l.classList.remove('active'); });
                    link.classList.add('active');
                });
            });

        })();
    </script>
